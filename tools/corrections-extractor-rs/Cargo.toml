[workspace]
resolver = "2"
members = ["crates/trace-data", "crates/corrections", "crates/relations"]

[workspace.package]
edition = "2021"
# f64::next_up (1.86), LazyLock, Option::is_none_or and precise capturing (`use<..>`).
rust-version = "1.86"
publish = false

[workspace.dependencies]
trace-data = { path = "crates/trace-data" }
indexmap = { version = "2", features = ["serde"] }
anyhow = "1"
rayon = "1.10"
flate2 = { version = "1", default-features = false, features = ["zlib"] }
libdeflater = "1.26"
bumpalo = { version = "3.20", features = ["collections"] }
memchr = "2"
regex = "1.11"
rusqlite = { version = "0.32", features = ["bundled"] }
mimalloc = { version = "0.1", default-features = false }
libmimalloc-sys = { version = "0.1", features = ["extended"] }
rustc-hash = "2"
ryu-js = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"

[profile.release]
lto = "fat"
codegen-units = 1
