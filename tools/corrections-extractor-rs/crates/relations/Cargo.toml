[package]
name = "relations"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Infers Questie quest relationships (prerequisites, exclusivity, breadcrumbs, ...) from QuestieTrace recordings"

[[bin]]
name = "relations"
path = "src/main.rs"

[dependencies]
trace-data.workspace = true
anyhow.workspace = true
indexmap.workspace = true
mimalloc.workspace = true
rayon.workspace = true
regex.workspace = true
rusqlite.workspace = true
rustc-hash.workspace = true
serde.workspace = true
# Report objects built with json! keep the order they were written in, whatever else the build
# enables (a dev-dependency of another crate turned this on in workspace builds only).
serde_json = { workspace = true, features = ["preserve_order"] }
sha2.workspace = true
