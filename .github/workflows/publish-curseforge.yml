name: Upload existing release to CurseForge
run-name: "Upload to CurseForge (${{ inputs.release_tag }})"

on:
  workflow_call:
    inputs:
      release_tag:
        description: Existing GitHub release tag
        type: string
        required: true
    secrets:
      CF_API_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag, or latest for the latest stable release
        type: string
        required: true
        default: latest

permissions:
  contents: read

jobs:
  publish:
    name: Upload
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - name: Clone project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download GitHub release
        run: |
          # Resolve latest once so the artifact and notes come from the same release.
          if [[ "$RELEASE_TAG" == "latest" ]]; then
            RELEASE_TAG=$(gh api "repos/$GH_REPO/releases/latest" --jq '.tag_name')
          fi
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"

          # Publish the existing GitHub artifact and notes without rebuilding them.
          gh release download --pattern "QuestieTrace-$RELEASE_TAG.zip" --dir "releases/$RELEASE_TAG" -- "$RELEASE_TAG"
          gh release view --json body --jq '.body' -- "$RELEASE_TAG" > CHANGELOG.md

      - name: Upload CurseForge
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: sh upload-cf.sh "$RELEASE_TAG"
