name: Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: Enter new version without the v prefix (for example "1.9.1") to bump the QuestieTrace version (optional)
        type: string
        default: ''
      release:
        description: (--release) Publish a normal release instead of a prerelease
        type: boolean
        default: false
      dry_run:
        description: (--dry_run) Preview release notes and metadata without publishing
        type: boolean
        default: false
      publish_curseforge:
        description: Upload to CurseForge
        type: boolean
        default: false
      publish_wago:
        description: Upload to Wago
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  tests:
    uses: './.github/workflows/ci.yml'
    with:
      event_name: ${{ github.event_name }}
      repo_full_name: ${{ github.repository }}
    secrets:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
  bump:
    uses: ./.github/workflows/versionbump.yml
    needs: tests
    secrets: inherit
    with:
      version: ${{ inputs.version }}
      dry_run: ${{ inputs.dry_run }}
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [ tests, bump ]
    outputs:
      release_tag: ${{ steps.metadata.outputs.release_tag }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
    permissions:
      contents: read

    env:
      RELEASE: ${{ inputs.release }}
      COMMIT_SHA: ${{ needs.bump.outputs.commit_sha }}

    steps:
      - name: Clone project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.bump.outputs.commit_sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Read release metadata
        id: metadata
        run: |
          VERSION=$(sed -n 's/^## Version: *//p' QuestieTrace-Classic.toc)
          RELEASE_TAG="v$VERSION"
          # Beta versions (-bN) stay prereleases even when released.
          PRERELEASE=false
          if [[ "$RELEASE" != "true" || "$VERSION" =~ -b[0-9]+$ ]]; then
            PRERELEASE=true
          fi
          # Mark untagged prereleases with the commit so each build gets its own release.
          if [[ "$RELEASE" != "true" ]]; then
            RELEASE_TAG+="-pre.${COMMIT_SHA:0:7}"
          fi
          # A bumped commit already carries its tag; otherwise list only unreleased commits.
          CLIFF_RANGE=--unreleased
          if git tag --points-at HEAD | grep -qx "v$VERSION"; then
            CLIFF_RANGE=--latest
          elif [[ "$RELEASE" == "true" ]] && git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            # GitHub would attach this build to the older tagged commit.
            echo "ERROR: v$VERSION already tags another commit. Enter a new version to bump." >&2
            exit 1
          fi

          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "cliff_range=$CLIFF_RANGE" >> "$GITHUB_OUTPUT"

      - name: Generate Changelog
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          config: cliff.toml
          args: ${{ steps.metadata.outputs.cliff_range }} --strip header
        env:
          OUTPUT: CHANGELOG.md

      - name: Build ZIP
        run: python build.py -r -v "$RELEASE_TAG"

      - name: Upload release artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            releases/${{ env.RELEASE_TAG }}/QuestieTrace-${{ env.RELEASE_TAG }}.zip
            releases/${{ env.RELEASE_TAG }}/release.json
            CHANGELOG.md
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Preview artifact
        if: ${{ inputs.dry_run }}
        run: |
          {
            echo "# Dry run: $RELEASE_TAG"
            echo "# Commit SHA: $COMMIT_SHA"
            echo
            cat CHANGELOG.md
            echo
            echo '## release.json'
            echo '```json'
            cat "releases/$RELEASE_TAG/release.json"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Send CI failure to Discord
        uses: nebularg/actions-discord-webhook@633ae6b03882743988dbc992eb147818ca96a93e # v1.0.0
        with:
          webhook_url: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ job.status }}
        if: ${{ failure() }}

  github:
    name: "GitHub: ${{ needs.build.outputs.release_tag }}"
    runs-on: ubuntu-latest
    needs: [ bump, build ]
    if: ${{ !inputs.dry_run }}
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
      PRERELEASE: ${{ needs.build.outputs.prerelease }}
      COMMIT_SHA: ${{ needs.bump.outputs.commit_sha }}
    steps:
      - name: Download release artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release

      - name: Create GitHub release
        run: |
          # GitHub creates a missing release tag at the commit used for this build.
          if [[ "$PRERELEASE" == "true" ]]; then
            gh release create "$RELEASE_TAG" \
              --target "$COMMIT_SHA" \
              --prerelease \
              -F CHANGELOG.md \
              "releases/$RELEASE_TAG/QuestieTrace-$RELEASE_TAG.zip" \
              "releases/$RELEASE_TAG/release.json"
          else
            gh release create "$RELEASE_TAG" \
              --target "$COMMIT_SHA" \
              -F CHANGELOG.md \
              "releases/$RELEASE_TAG/QuestieTrace-$RELEASE_TAG.zip" \
              "releases/$RELEASE_TAG/release.json"
          fi

      - name: Send CI failure to Discord
        uses: nebularg/actions-discord-webhook@633ae6b03882743988dbc992eb147818ca96a93e # v1.0.0
        with:
          webhook_url: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ job.status }}
        if: ${{ failure() }}

  curseforge:
    name: "CurseForge: ${{ needs.build.outputs.release_tag }}"
    needs: [ build, github ]
    if: ${{ inputs.publish_curseforge && !inputs.dry_run }}
    permissions:
      contents: read
    uses: ./.github/workflows/publish-curseforge.yml
    with:
      release_tag: ${{ needs.build.outputs.release_tag }}
    secrets:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}

  wago:
    name: "Wago: ${{ needs.build.outputs.release_tag }}"
    needs: [ build, github ]
    if: ${{ inputs.publish_wago && !inputs.dry_run }}
    permissions:
      contents: read
    uses: ./.github/workflows/publish-wago.yml
    with:
      release_tag: ${{ needs.build.outputs.release_tag }}
    secrets:
      WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
